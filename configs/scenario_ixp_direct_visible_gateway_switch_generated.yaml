time_resolution: NS
topology: topology/ixp_scion_direct_peers_topology.xml
output: build/scenario_ixp_dual_sat_visible_gateway_switch_generated.txt
simulation_duration: 10000.000s
NUM_CORE: 1

events_file: user_defined_events/scenario_ixp_gateway_switch_30links_dual_generated_events.json

beacon_service:
  policy: baseline
  period: 10s
  expiration_period: 1350s
  first_beaconing: 0s
  last_beaconing: 10000.000s

path_service: {}
border_router: {}

stochastic_latency_model:
  enabled: true
  R_eff_m: 1400000.0
  alpha: 1.3
  mu_link_s: 0.0055
  sigma_link_s: 0.0012
  delta_s: 0.0004
  beta: 0.08
  omega_rad_s: 0.0041887902047863905
  R_L_m: 600000.0
  R_M_m: 6000000.0
  P: 6
  N_p: 12

control_plane_logging:
  beacon_events: false
  path_server_updates: false
  host_cache_updates: false
  log_file: build/scenario_ixp_dual_sat_visible_gateway_switch_generated_control_plane.log

path_snapshot_logger:
  period: 300s
  output: build/scenario_ixp_dual_sat_visible_gateway_switch_generated_path_snapshots.csv
  max_paths_per_dst: 5
  discover_all_pairs: true
  request_lead_time: 500ms

data_plane_probing:
  start: 10s
  period: 1s
  timeout: 2s
  count: 9990
  source_path_policy:
    - src_as: 102
      src_host: 2
      preferred_first_hop_as: 120
      backup_first_hop_as: 121
    - src_as: 102
      src_host: 3
      preferred_first_hop_as: 121
      backup_first_hop_as: 120
    - src_as: 103
      src_host: 2
      preferred_first_hop_as: 120
      backup_first_hop_as: 121
    - src_as: 103
      src_host: 3
      preferred_first_hop_as: 121
      backup_first_hop_as: 120
    - src_as: 104
      src_host: 2
      preferred_first_hop_as: 120
      backup_first_hop_as: 121
    - src_as: 104
      src_host: 3
      preferred_first_hop_as: 121
      backup_first_hop_as: 120
    - src_as: 105
      src_host: 2
      preferred_first_hop_as: 120
      backup_first_hop_as: 121
    - src_as: 105
      src_host: 3
      preferred_first_hop_as: 121
      backup_first_hop_as: 120
  pairs:
    - src_as: 101
      dst_as: 102
      src_host: 2
      dst_host: 2
      output: build/dual_sat_visible/scion_probe_101_102.csv
    - src_as: 102
      dst_as: 103
      src_host: 2
      dst_host: 2
      output: build/dual_sat_visible/scion_probe_102_103.csv
    - src_as: 102
      dst_as: 104
      src_host: 2
      dst_host: 2
      output: build/dual_sat_visible/scion_probe_102_104.csv
    - src_as: 102
      dst_as: 105
      src_host: 2
      dst_host: 2
      output: build/dual_sat_visible/scion_probe_102_105.csv
    - src_as: 103
      dst_as: 104
      src_host: 2
      dst_host: 2
      output: build/dual_sat_visible/scion_probe_103_104.csv
    - src_as: 103
      dst_as: 105
      src_host: 2
      dst_host: 2
      output: build/dual_sat_visible/scion_probe_103_105.csv
    - src_as: 104
      dst_as: 105
      src_host: 2
      dst_host: 2
      output: build/dual_sat_visible/scion_probe_104_105.csv

cp_summary_output: build/scenario_ixp_as110_dual_sat_visible_cp_summary.csv
# Scenario: Visible dual IXP satellites (120/121 representing two distinct orbits of AS110)
# Link events directly alter SCION interfaces; failures are visible and trigger reconvergence.
# Satellites 102-105 connect to both 120 (primary orbit) and 121 (backup orbit).
