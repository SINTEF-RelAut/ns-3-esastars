# Scenario: Hidden dual IXP satellites (120/121, VIXP manages one active per AS)
# Virtual IXP fabric controls which satellite (120 or 121) is active for each satellite AS.
# One active IXP attachment per AS; fast 1s rebalance.
virtual_ixp:
  enabled: true
  port_count: 4
  rebalance_period: 1s
  hold_down: 0s
  max_active_links_per_as:
    102: 2
    103: 2
    104: 2
    105: 2
  # Quality ordering keeps both locations active when feasible:
  # AS120-primary(1.00), AS121-primary(0.95), AS120-backup(0.80), AS121-backup(0.75).
  # This removes the global "AS121 is backup for AS120" behavior while preserving per-satellite backup links.
  links:
    # IXP satellite A (AS 120) — location A, interface-1 primary / interface-2 backup
    - real_as: 102
      if_id: 1020001
      quality: 1.0
    - real_as: 102
      if_id: 1020002
      quality: 0.8
    - real_as: 103
      if_id: 1030001
      quality: 1.0
    - real_as: 103
      if_id: 1030002
      quality: 0.8
    - real_as: 104
      if_id: 1040001
      quality: 1.0
    - real_as: 104
      if_id: 1040002
      quality: 0.8
    - real_as: 105
      if_id: 1050001
      quality: 1.0
    - real_as: 105
      if_id: 1050002
      quality: 0.8
    # IXP satellite B (AS 121) — location B, interface-1 primary / interface-2 backup
    - real_as: 102
      if_id: 1020003
      quality: 0.95
    - real_as: 102
      if_id: 1020004
      quality: 0.75
    - real_as: 103
      if_id: 1030003
      quality: 0.95
    - real_as: 103
      if_id: 1030004
      quality: 0.75
    - real_as: 104
      if_id: 1040003
      quality: 0.95
    - real_as: 104
      if_id: 1040004
      quality: 0.75
    - real_as: 105
      if_id: 1050003
      quality: 0.95
    - real_as: 105
      if_id: 1050004
      quality: 0.75

