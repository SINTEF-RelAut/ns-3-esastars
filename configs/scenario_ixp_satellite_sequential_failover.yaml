time_resolution: NS
topology: topology/ixp_dual_links_102_105_topology.xml
output: build/scenario_ixp_satellite_sequential_failover.txt
simulation_duration: 260s
NUM_CORE: 1

events_file: user_defined_events/scenario_ixp_satellite_sequential_failover_events.json

beacon_service:
  policy: baseline
  period: 10s
  expiration_period: 1350s
  first_beaconing: 0s
  last_beaconing: 260s

path_service: {}
border_router: {}

control_plane_logging:
  beacon_events: true
  path_server_updates: true
  host_cache_updates: true
  log_file: build/scenario_ixp_satellite_sequential_failover_control_plane.log

path_snapshot_logger:
  period: 1s
  output: build/scenario_ixp_satellite_sequential_failover_path_snapshots.csv
  max_paths_per_dst: 5
  discover_all_pairs: true
  request_lead_time: 500ms

