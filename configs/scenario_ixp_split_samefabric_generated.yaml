# Scenario: two distant IXP satellites, no link between them; handover within a location, both cables on the same fabric AS so it is hidden below IP
#
# Deliberately NO source_path_policy. It is inert here twice over: SelectPreferredSegment is
# unreachable when every AS is type="core", and the per-AS probe-host lookup in
# pre-simulation-setup.cc keys an alias index against a map of real XML ids, so only host 2 is
# ever created. Preference comes from the topology instead: each half reaches its own exchange
# in one hop and the other only across a 20ms internal link.
#
# Probe pairs, matching the BGP program's split-mode set exactly:
#   (101,1020)            ground to satellite
#   8 same-location pairs four via each exchange satellite
#   4 sibling pairs       ride a constellation's internal link directly
#   4 diagonal pairs      cross both an exchange and an internal link, showing the stretch
