time_resolution: NS
topology: topology/ixp_as110_dual_links_topology.xml
output: build/scenario_ixp_single_sat_hidden_gateway_switch_generated.txt
simulation_duration: 10000.000s
NUM_CORE: 1

events_file: user_defined_events/scenario_ixp_gateway_switch_30links_generated_events.json

beacon_service:
  policy: baseline
  period: 10s
  expiration_period: 1350s
  first_beaconing: 0s
  last_beaconing: 10000.000s

path_service: {}
border_router: {}

control_plane_logging:
  beacon_events: false
  path_server_updates: false
  host_cache_updates: false
  log_file: build/scenario_ixp_single_sat_hidden_gateway_switch_generated_control_plane.log

path_snapshot_logger:
  period: 300s
  output: build/scenario_ixp_single_sat_hidden_gateway_switch_generated_path_snapshots.csv
  max_paths_per_dst: 5
  discover_all_pairs: true
  request_lead_time: 500ms

data_plane_probing:
  start: 10s
  period: 1s
  timeout: 2s
  count: 9990
  pairs:
    - src_as: 101
      dst_as: 102
      src_host: 2
      dst_host: 2
    - src_as: 102
      dst_as: 103
      src_host: 2
      dst_host: 2
    - src_as: 102
      dst_as: 104
      src_host: 2
      dst_host: 2
    - src_as: 102
      dst_as: 105
      src_host: 2
      dst_host: 2
    - src_as: 103
      dst_as: 104
      src_host: 2
      dst_host: 2
    - src_as: 103
      dst_as: 105
      src_host: 2
      dst_host: 2
    - src_as: 104
      dst_as: 105
      src_host: 2
      dst_host: 2

# Scenario 1 (anycast-like VIXP): one active IXP attachment per AS; fast 1s rebalance.
virtual_ixp:
  enabled: true
  port_count: 4
  rebalance_period: 1s
  hold_down: 0s
  max_active_links_per_as:
    102: 1
    103: 1
    104: 1
    105: 1
  links:
    - real_as: 102
      if_id: 1020001
      quality: 1.0
    - real_as: 102
