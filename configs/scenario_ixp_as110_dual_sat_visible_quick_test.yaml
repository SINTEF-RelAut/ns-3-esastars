time_resolution: NS
topology: topology/ixp_as110_dual_satellites_topology.xml
output: build/scenario_ixp_as110_dual_sat_visible_quick_test.txt
simulation_duration: 20s
NUM_CORE: 1

events_file: user_defined_events/scenario_ixp_gateway_switch_generated_events.json

beacon_service:
  policy: baseline
  period: 10s
  expiration_period: 1350s
  first_beaconing: 0s
  last_beaconing: 20s

path_service: {}
border_router: {}

control_plane_logging:
  beacon_events: true
  path_server_updates: true
  host_cache_updates: true
  log_file: build/scenario_ixp_as110_dual_sat_visible_quick_test_control_plane.log

path_snapshot_logger:
  period: 1s
  output: build/scenario_ixp_as110_dual_sat_visible_quick_test_path_snapshots.csv
  max_paths_per_dst: 5
  discover_all_pairs: true
  request_lead_time: 500ms

data_plane_probing:
  start: 5s
  period: 1s
  timeout: 2s
  count: 12
  pairs:
    - src_as: 101
      dst_as: 102
      src_host: 2
      dst_host: 2
    - src_as: 102
      dst_as: 103
      src_host: 2
      dst_host: 2
    - src_as: 102
      dst_as: 104
      src_host: 2
      dst_host: 2
